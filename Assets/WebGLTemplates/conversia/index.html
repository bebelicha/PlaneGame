<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Conversia Game Hub</title>
    <link rel="icon" href="data:;base64,iVBORw0KGgo=" />
    <style>
      #loading-cover {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f7f7f8;
        color: #111;
        z-index: 9999;
        font-family: Arial, sans-serif;
      }
      #loading-box {
        width: 340px;
        max-width: 92%;
        text-align: center;
        background: #ffffff;
        padding: 20px 18px;
        border-radius: 12px;
        box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      }
      #loading-title {
        margin-bottom: 12px;
        font-weight: bold;
        color: #111;
      }
      #progress-track {
        height: 10px;
        background: #e5e7eb;
        border-radius: 6px;
        overflow: hidden;
        box-shadow: inset 0 1px 2px rgba(0,0,0,0.06);
      }
      #progress-bar {
        width: 0%;
        height: 100%;
        background: linear-gradient(90deg,#93c5fd,#3b82f6);
        transition: width .15s ease;
      }
      #progress-text {
        margin-top: 8px;
        font-size: 12px;
        opacity: .9;
        color: #4b5563;
      }
    </style>
  </head>
  <body style="text-align: center; padding: 0; border: 0; margin: 0;">
    <div id="loading-cover" aria-live="polite">
      <div id="loading-box">
        <div id="loading-title">Carregando...</div>
        <div id="progress-track"><div id="progress-bar"></div></div>
        <div id="progress-text">Carregando... 0%</div>
      </div>
    </div>

    <canvas id="unity-canvas" width="1280" height="740" tabindex="-1" style="width: 1280px; height: 740px; background: #231F20"></canvas>
    <script>
      let unityInstance;
      const loadingCover = document.getElementById('loading-cover');
      const progressBar = document.getElementById('progress-bar');
      const progressText = document.getElementById('progress-text');
      const messageQueue = [];

      function dispatchToUnity(functionName, payload) {
        if (!functionName) {
          return;
        }
        const json = typeof payload === 'string' ? payload : JSON.stringify(payload);
        if (unityInstance) {
          try {
            unityInstance.SendMessage('ConversiaGameBridge', functionName, json);
          } catch (err) {
            console.error('[ConversiaBridge] SendMessage failed', err, functionName, json);
          }
        } else {
          messageQueue.push({ functionName, json });
        }
      }

      function flushQueuedMessages() {
        if (!unityInstance || !messageQueue.length) {
          return;
        }
        while (messageQueue.length) {
          const item = messageQueue.shift();
          try {
            unityInstance.SendMessage('ConversiaGameBridge', item.functionName, item.json);
          } catch (err) {
            console.error('[ConversiaBridge] Failed to flush queued message', err, item);
          }
        }
      }

      function startUnity() {
        const canvas = document.querySelector('#unity-canvas');
        createUnityInstance(canvas, {
          dataUrl: 'Build/Builds.data',
          frameworkUrl: 'Build/Builds.framework.js',
          codeUrl: 'Build/Builds.wasm',
          streamingAssetsUrl: 'StreamingAssets',
          companyName: 'DefaultCompany',
          productName: 'PlaneGame',
          productVersion: '1.0',
        }, (progress) => {
          const pct = Math.round(progress * 100);
          progressBar.style.width = pct + '%';
          progressText.textContent = 'Carregando... ' + pct + '%';
        }).then((instance) => {
          unityInstance = instance;
          loadingCover.style.display = 'none';
          flushQueuedMessages();
        }).catch((message) => {
          console.error(message);
          progressText.textContent = 'Falha ao carregar o jogo.';
        });
      }

      (function ensureUnityLoader() {
        if (typeof window.createUnityInstance === 'function') {
          startUnity();
          return;
        }
        const loader = document.createElement('script');
        loader.src = './Build/Builds.loader.js';
        loader.onload = startUnity;
        loader.onerror = function () {
          console.error('Não foi possível carregar Build/Builds.loader.js');
          progressText.textContent = 'Falha ao carregar o loader do Unity.';
        };
        document.head.appendChild(loader);
      })();

      window.addEventListener('message', (event) => {
        const data = event.data;
        if (!data || data.source !== 'conversia') {
          return;
        }
        switch (data.type) {
          case 'init':
            dispatchToUnity('OnConversiaInit', data);
            break;
          case 'trigger':
            dispatchToUnity('OnConversiaTrigger', data);
            break;
          case 'analog':
            dispatchToUnity('OnConversiaAnalog', data);
            break;
          case 'preferences':
            dispatchToUnity('OnConversiaPreferences', data);
            break;
          case 'command':
            dispatchToUnity('OnConversiaCommand', data);
            break;
          default:
            console.debug('[ConversiaBridge] Unknown message type', data);
            break;
        }
      });

      window.ConversiaGame = {
        sendReady() {
          window.parent?.postMessage({ source: 'game', type: 'ready', timestamp: Date.now() }, '*');
        },
        sendStats(stats) {
          const payload = Object.assign({ source: 'game', type: 'stats', timestamp: Date.now() }, stats || {});
          window.parent?.postMessage(payload, '*');
        },
        sendPreferences(entries, context) {
          window.parent?.postMessage({ source: 'game', type: 'preferencesUpdate', context: context || 'update', entries, timestamp: Date.now() }, '*');
        },
        requestPreferences() {
          window.parent?.postMessage({ source: 'game', type: 'preferencesRequest', timestamp: Date.now() }, '*');
        },
        sendCommand(command, payload) {
          window.parent?.postMessage({ source: 'game', type: 'command', command, payload, timestamp: Date.now() }, '*');
        },
      };
    </script>
  </body>
</html>
